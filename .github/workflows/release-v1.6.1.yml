name: Release v1.6.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.6.1.yml'
      - 'RELEASE_NOTES_v1.6.1.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.6.1
  cancel-in-progress: true

env:
  VERSION: 1.6.1
  PROJECT: src/AI.GitHubManager.App/AI.GitHubManager.App.csproj

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify project version
        shell: bash
        run: |
          grep -q '<Version>1.6.1</Version>' "$PROJECT"
          grep -q '<AssemblyVersion>1.6.1.0</AssemblyVersion>' "$PROJECT"
          grep -q '<FileVersion>1.6.1.0</FileVersion>' "$PROJECT"
          grep -q '<InformationalVersion>1.6.1</InformationalVersion>' "$PROJECT"

      - name: Restore
        run: dotnet restore AI.GitHubManager.sln

      - name: Build
        run: dotnet build AI.GitHubManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test AI.GitHubManager.sln -c Release --no-build --verbosity normal

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            archive: tar
          - name: macos-x64
            os: macos-15-intel
            rid: osx-x64
            archive: zip
          - name: macos-arm64
            os: macos-14
            rid: osx-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "artifacts/publish/${{ matrix.rid }}"

      - name: Add release documents
        shell: bash
        run: |
          cp LICENSE "artifacts/publish/${{ matrix.rid }}/LICENSE.txt"
          cp PRIVACY.md "artifacts/publish/${{ matrix.rid }}/PRIVACY.md"
          cp SECURITY.md "artifacts/publish/${{ matrix.rid }}/SECURITY.md"
          cp THIRD-PARTY-NOTICES.md "artifacts/publish/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md"
          cp RELEASE_NOTES_v1.6.1.md "artifacts/publish/${{ matrix.rid }}/RELEASE_NOTES.md"

      - name: Create Windows archive
        if: matrix.archive == 'zip' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "AI-GitHub-Manager-v${env:VERSION}-${{ matrix.name }}.zip"
          Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/$name" -CompressionLevel Optimal

      - name: Create macOS archive
        if: matrix.archive == 'zip' && runner.os == 'macOS'
        shell: bash
        run: |
          cd "artifacts/publish/${{ matrix.rid }}"
          zip -9 -r "../../AI-GitHub-Manager-v${VERSION}-${{ matrix.name }}.zip" .

      - name: Create Linux archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          tar -C "artifacts/publish/${{ matrix.rid }}" -czf "artifacts/AI-GitHub-Manager-v${VERSION}-${{ matrix.name }}.tar.gz" .

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd artifacts
          if ls AI-GitHub-Manager-v${VERSION}-${{ matrix.name }}.zip >/dev/null 2>&1; then
            FILE="AI-GitHub-Manager-v${VERSION}-${{ matrix.name }}.zip"
          else
            FILE="AI-GitHub-Manager-v${VERSION}-${{ matrix.name }}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FILE" > "$FILE.sha256"
          else
            shasum -a 256 "$FILE" > "$FILE.sha256"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            artifacts/AI-GitHub-Manager-v${{ env.VERSION }}-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create tag and release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; no duplicate will be created."
            exit 0
          fi

          gh release create "v${VERSION}" \
            release-assets/* \
            --target "${GITHUB_SHA}" \
            --title "AI GitHub Manager v${VERSION}" \
            --notes-file RELEASE_NOTES_v1.6.1.md \
            --latest \
            --verify-tag=false
