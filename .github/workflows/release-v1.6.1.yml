name: Release v1.6.1 — Windows and Linux

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.6.1.yml'
      - 'installer/AI-GitHub-Manager.iss'
      - 'RELEASE_NOTES_v1.6.1.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.6.1-windows-linux
  cancel-in-progress: true

env:
  VERSION: 1.6.1
  PROJECT: src/AI.GitHubManager.App/AI.GitHubManager.App.csproj

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify project and installer versions
        shell: bash
        run: |
          grep -q '<Version>1.6.1</Version>' "$PROJECT"
          grep -q '<AssemblyVersion>1.6.1.0</AssemblyVersion>' "$PROJECT"
          grep -q '<FileVersion>1.6.1.0</FileVersion>' "$PROJECT"
          grep -q '<InformationalVersion>1.6.1</InformationalVersion>' "$PROJECT"
          grep -q '#define AppVersion "1.6.1"' installer/AI-GitHub-Manager.iss

      - name: Restore
        run: dotnet restore AI.GitHubManager.sln

      - name: Build
        run: dotnet build AI.GitHubManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test AI.GitHubManager.sln -c Release --no-build --verbosity normal

  portable-packages:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "artifacts/publish/${{ matrix.rid }}"

      - name: Add release documents
        shell: bash
        run: |
          cp LICENSE "artifacts/publish/${{ matrix.rid }}/LICENSE.txt"
          cp PRIVACY.md "artifacts/publish/${{ matrix.rid }}/PRIVACY.md"
          cp SECURITY.md "artifacts/publish/${{ matrix.rid }}/SECURITY.md"
          cp THIRD-PARTY-NOTICES.md "artifacts/publish/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md"
          cp RELEASE_NOTES_v1.6.1.md "artifacts/publish/${{ matrix.rid }}/RELEASE_NOTES.md"

      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "AI-GitHub-Manager-v${env:VERSION}-${{ matrix.name }}.zip"
          Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "artifacts/$name.sha256" -Encoding ascii

      - name: Create Linux archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          file="artifacts/AI-GitHub-Manager-v${VERSION}-${{ matrix.name }}.tar.gz"
          tar -C "artifacts/publish/${{ matrix.rid }}" -czf "$file" .
          sha256sum "$file" > "$file.sha256"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            artifacts/AI-GitHub-Manager-v${{ env.VERSION }}-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: Build Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows x64 payload
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/publish/win-x64
          Copy-Item LICENSE artifacts/publish/win-x64/LICENSE.txt
          Copy-Item PRIVACY.md artifacts/publish/win-x64/PRIVACY.md
          Copy-Item SECURITY.md artifacts/publish/win-x64/SECURITY.md
          Copy-Item THIRD-PARTY-NOTICES.md artifacts/publish/win-x64/THIRD-PARTY-NOTICES.md
          Copy-Item RELEASE_NOTES_v1.6.1.md artifacts/publish/win-x64/RELEASE_NOTES.md

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer and checksum
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler ISCC.exe was not found.'
          }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $iscc installer/AI-GitHub-Manager.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = "artifacts/installer/AI_GitHub_Manager_Setup_${env:VERSION}_win-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not created: $installer"
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AI_GitHub_Manager_Setup_${env:VERSION}_win-x64.exe" | Set-Content "$installer.sha256" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            artifacts/installer/AI_GitHub_Manager_Setup_${{ env.VERSION }}_win-x64.exe
            artifacts/installer/AI_GitHub_Manager_Setup_${{ env.VERSION }}_win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Update GitHub release
    needs:
      - portable-packages
      - windows-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows and Linux assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release-assets/* --clobber
            gh release edit "v${VERSION}" \
              --title "AI GitHub Manager v${VERSION}" \
              --notes-file RELEASE_NOTES_v1.6.1.md \
              --latest
          else
            gh release create "v${VERSION}" \
              release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "AI GitHub Manager v${VERSION}" \
              --notes-file RELEASE_NOTES_v1.6.1.md \
              --latest \
              --verify-tag=false
          fi
