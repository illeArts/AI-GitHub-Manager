name: Release v1.6.4 — Windows, macOS and Linux

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.6.4.yml'
      - 'installer/AI-GitHub-Manager.iss'
      - 'RELEASE_NOTES_v1.6.4.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.6.4-windows-linux
  cancel-in-progress: true

env:
  VERSION: 1.6.4
  PROJECT: src/AI.GitHubManager.App/AI.GitHubManager.App.csproj

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify project and installer versions
        shell: bash
        run: |
          grep -q '<Version>1.6.4</Version>' "$PROJECT"
          grep -q '<AssemblyVersion>1.6.4.0</AssemblyVersion>' "$PROJECT"
          grep -q '<FileVersion>1.6.4.0</FileVersion>' "$PROJECT"
          grep -q '<InformationalVersion>1.6.4</InformationalVersion>' "$PROJECT"
          grep -q '#define AppVersion "1.6.4"' installer/AI-GitHub-Manager.iss

      - name: Restore
        run: dotnet restore AI.GitHubManager.sln

      - name: Build
        run: dotnet build AI.GitHubManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test AI.GitHubManager.sln -c Release --no-build --verbosity normal

  portable-packages:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "artifacts/publish/${{ matrix.rid }}"

      - name: Add release documents
        shell: bash
        run: |
          cp LICENSE "artifacts/publish/${{ matrix.rid }}/LICENSE.txt"
          cp PRIVACY.md "artifacts/publish/${{ matrix.rid }}/PRIVACY.md"
          cp SECURITY.md "artifacts/publish/${{ matrix.rid }}/SECURITY.md"
          cp THIRD-PARTY-NOTICES.md "artifacts/publish/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md"
          cp RELEASE_NOTES_v1.6.4.md "artifacts/publish/${{ matrix.rid }}/RELEASE_NOTES.md"

      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "AI-GitHub-Manager-v${env:VERSION}-${{ matrix.name }}.zip"
          Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "artifacts/$name.sha256" -Encoding ascii

      - name: Create Linux archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          file="artifacts/AI-GitHub-Manager-v${VERSION}-${{ matrix.name }}.tar.gz"
          tar -C "artifacts/publish/${{ matrix.rid }}" -czf "$file" .
          sha256sum "$file" > "$file.sha256"

      - name: Upload portable package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: |
            artifacts/AI-GitHub-Manager-v${{ env.VERSION }}-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 30

  macos-packages:
    name: Package macOS ${{ matrix.arch_label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            arch_label: arm64
          - rid: osx-x64
            arch_label: x64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "artifacts/publish/${{ matrix.rid }}"

      # ── Assemble a real .app bundle ─────────────────────────────────────────
      # The published output above is a single-file executable plus a few
      # native Avalonia .dylib files sitting next to it. Finder cannot open a
      # bare executable as an app, so it must be wrapped in a proper
      # Contents/{MacOS,Resources}/Info.plist bundle before it is zipped.
      - name: Assemble AI GitHub Manager.app bundle
        run: |
          set -euo pipefail
          APP="artifacts/appbundle/AI GitHub Manager.app"
          PUBLISH_DIR="artifacts/publish/${{ matrix.rid }}"
          rm -rf "artifacts/appbundle"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "$PUBLISH_DIR/AI.GitHubManager.App" "$APP/Contents/MacOS/AI.GitHubManager.App"
          cp "$PUBLISH_DIR/"*.dylib "$APP/Contents/MacOS/" 2>/dev/null || true
          chmod +x "$APP/Contents/MacOS/AI.GitHubManager.App"

          cp src/AI.GitHubManager.App/Assets/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp LICENSE "$APP/Contents/Resources/LICENSE.txt"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>              <string>AI GitHub Manager</string>
              <key>CFBundleDisplayName</key>       <string>AI GitHub Manager</string>
              <key>CFBundleExecutable</key>        <string>AI.GitHubManager.App</string>
              <key>CFBundleIdentifier</key>        <string>${BUNDLE_ID}</string>
              <key>CFBundleVersion</key>           <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundlePackageType</key>       <string>APPL</string>
              <key>CFBundleSignature</key>         <string>????</string>
              <key>CFBundleIconFile</key>          <string>AppIcon.icns</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>LSMinimumSystemVersion</key>    <string>12.0</string>
              <key>NSHighResolutionCapable</key>   <true/>
              <key>NSHumanReadableCopyright</key>  <string>© 2026 illeArts</string>
              <key>NSPrincipalClass</key>          <string>NSApplication</string>
              <key>LSApplicationCategoryType</key> <string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"
        env:
          BUNDLE_ID: com.illearts.AIGitHubManager
          VERSION: ${{ env.VERSION }}

      # ── Code signing ─────────────────────────────────────────────────────────
      # Without a Developer ID Application certificate we can only ad-hoc sign
      # (codesign --sign -). This satisfies Gatekeeper's "is it signed at all"
      # check well enough to run locally, but it is NOT a Developer ID
      # signature and the app is NOT notarized — macOS will still show an
      # "unidentified developer" warning on first launch for other users.
      #
      # To add real Developer ID signing + notarization later, add these
      # repository secrets and uncomment the signing/notarization step below:
      #   MACOS_CERTIFICATE_P12_BASE64   — base64-encoded Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD     — password for the .p12
      #   MACOS_SIGNING_IDENTITY         — e.g. "Developer ID Application: Your Name (TEAMID)"
      #   MACOS_NOTARIZATION_APPLE_ID    — Apple ID used for notarization
      #   MACOS_NOTARIZATION_TEAM_ID     — Apple Developer Team ID
      #   MACOS_NOTARIZATION_PASSWORD    — app-specific password for notarytool
      - name: Ad-hoc code signing (placeholder — not a Developer ID signature)
        run: |
          set -euo pipefail
          APP="artifacts/appbundle/AI GitHub Manager.app"
          # A stray resource-fork/Finder-info extended attribute on any file
          # (or on the bundle directory itself, which LaunchServices/Icon
          # Services can (re-)tag with a "has custom icon" flag the instant
          # it notices a .app bundle — this can happen *after* a successful
          # codesign --sign and make the very next codesign --verify fail)
          # makes codesign refuse with "resource fork, Finder information,
          # or similar detritus not allowed". Audit, strip, sign, audit
          # again, targeted re-strip of FinderInfo if it reappeared, then
          # verify — never proceed past a failure.
          echo "Extended attributes before cleanup:"
          xattr -lr "$APP" 2>/dev/null || true

          xattr -cr "$APP" 2>/dev/null || true
          find "$APP" -exec xattr -c {} \; 2>/dev/null || true
          if xattr -lr "$APP" 2>/dev/null | grep -q .; then
            xattr -lr "$APP"
            echo "::error::Extended attributes remain on the bundle after stripping."
            exit 1
          fi

          codesign --force --deep --sign - "$APP"

          if xattr -lr "$APP" 2>/dev/null | grep -q "com.apple.FinderInfo"; then
            echo "com.apple.FinderInfo reappeared after signing — removing it and re-signing once ..."
            xattr -d com.apple.FinderInfo "$APP" 2>/dev/null || true
            find "$APP" -exec xattr -d com.apple.FinderInfo {} \; 2>/dev/null || true
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=4 "$APP"

      # - name: Import Developer ID certificate
      #   if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
      #   run: |
      #     echo "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" | base64 --decode > cert.p12
      #     security create-keychain -p actions build.keychain
      #     security import cert.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
      #     codesign --force --deep --options runtime \
      #       --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" \
      #       "artifacts/appbundle/AI GitHub Manager.app"
      #
      # - name: Notarize
      #   if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
      #   run: |
      #     ditto -c -k --sequesterRsrc --keepParent \
      #       "artifacts/appbundle/AI GitHub Manager.app" notarize.zip
      #     xcrun notarytool submit notarize.zip \
      #       --apple-id "${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}" \
      #       --team-id "${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}" \
      #       --password "${{ secrets.MACOS_NOTARIZATION_PASSWORD }}" \
      #       --wait
      #     xcrun stapler staple "artifacts/appbundle/AI GitHub Manager.app"

      - name: Verify bundle contents (no Windows binaries, correct arch)
        run: |
          set -euo pipefail
          BIN="artifacts/appbundle/AI GitHub Manager.app/Contents/MacOS/AI.GitHubManager.App"
          file "$BIN"
          case "${{ matrix.rid }}" in
            osx-arm64) file "$BIN" | grep -q "arm64" ;;
            osx-x64)   file "$BIN" | grep -q "x86_64" ;;
          esac
          if find "artifacts/appbundle/AI GitHub Manager.app" -iname "*.exe" -o -iname "*.msi" | grep -q .; then
            echo "::error::Windows binaries found inside the macOS .app bundle"
            exit 1
          fi

      # ── Zip with ditto (preserves the bundle correctly; a plain zip of the
      # loose files is exactly the mistake this workflow exists to fix) ──────
      - name: Create archive with ditto
        run: |
          NAME="AI-GitHub-Manager-v${VERSION}-macos-${{ matrix.arch_label }}.zip"
          mkdir -p artifacts/dist
          ditto -c -k --sequesterRsrc --keepParent \
            "artifacts/appbundle/AI GitHub Manager.app" \
            "artifacts/dist/$NAME"
          shasum -a 256 "artifacts/dist/$NAME" | awk -v n="$NAME" '{print $1"  "n}' > "artifacts/dist/$NAME.sha256"
        env:
          VERSION: ${{ env.VERSION }}

      - name: Unpack the archive and fully re-verify the extracted app
        # This is not a cosmetic spot-check: it re-runs every acceptance
        # check (real .app present, executable bit, correct architecture,
        # valid Info.plist, no Windows binaries, valid codesign) against the
        # UNPACKED copy of the exact ZIP that will be uploaded/released. A
        # ZIP whose signature only holds up before packaging is worthless.
        run: |
          set -euo pipefail
          NAME="AI-GitHub-Manager-v${VERSION}-macos-${{ matrix.arch_label }}.zip"
          APP="/tmp/unzip-check/AI GitHub Manager.app"
          BIN="$APP/Contents/MacOS/AI.GitHubManager.App"
          rm -rf /tmp/unzip-check && mkdir -p /tmp/unzip-check
          ditto -x -k "artifacts/dist/$NAME" /tmp/unzip-check

          test -d "$APP"
          test -x "$BIN"

          file "$BIN"
          case "${{ matrix.rid }}" in
            osx-arm64) file "$BIN" | grep -q "arm64" ;;
            osx-x64)   file "$BIN" | grep -q "x86_64" ;;
          esac

          plutil -lint "$APP/Contents/Info.plist"

          if find "$APP" -iname "*.exe" -o -iname "*.msi" | grep -q .; then
            echo "::error::Windows binaries found in the unpacked archive"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"

          spctl --assess --type execute --verbose=4 "$APP" || \
            echo "::warning::spctl rejected the ad-hoc signed app (expected without Developer ID + notarization) — not a failure."
        env:
          VERSION: ${{ env.VERSION }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch_label }}
          path: |
            artifacts/dist/AI-GitHub-Manager-v${{ env.VERSION }}-macos-${{ matrix.arch_label }}.zip
            artifacts/dist/AI-GitHub-Manager-v${{ env.VERSION }}-macos-${{ matrix.arch_label }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: Build Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows x64 payload
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/publish/win-x64
          Copy-Item LICENSE artifacts/publish/win-x64/LICENSE.txt
          Copy-Item PRIVACY.md artifacts/publish/win-x64/PRIVACY.md
          Copy-Item SECURITY.md artifacts/publish/win-x64/SECURITY.md
          Copy-Item THIRD-PARTY-NOTICES.md artifacts/publish/win-x64/THIRD-PARTY-NOTICES.md
          Copy-Item RELEASE_NOTES_v1.6.4.md artifacts/publish/win-x64/RELEASE_NOTES.md

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer and checksum
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler ISCC.exe was not found.'
          }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $iscc installer/AI-GitHub-Manager.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = "artifacts/installer/AI_GitHub_Manager_Setup_${env:VERSION}_win-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not created: $installer"
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AI_GitHub_Manager_Setup_${env:VERSION}_win-x64.exe" | Set-Content "$installer.sha256" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: |
            artifacts/installer/AI_GitHub_Manager_Setup_${{ env.VERSION }}_win-x64.exe
            artifacts/installer/AI_GitHub_Manager_Setup_${{ env.VERSION }}_win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Update GitHub release
    needs:
      - portable-packages
      - macos-packages
      - windows-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows and Linux assets
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release-assets/* --clobber
            gh release edit "v${VERSION}" \
              --title "AI GitHub Manager v${VERSION}" \
              --notes-file RELEASE_NOTES_v1.6.4.md \
              --latest
          else
            gh release create "v${VERSION}" \
              release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "AI GitHub Manager v${VERSION}" \
              --notes-file RELEASE_NOTES_v1.6.4.md \
              --latest \
              --verify-tag=false
          fi
