name: Publish Windows installer v1.6.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-installer-v1.6.3.yml'
      - 'installer/AI-GitHub-Manager.iss'
      - 'src/**'
      - 'tests/**'
      - 'AI.GitHubManager.sln'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.6.3
  PROJECT: src/AI.GitHubManager.App/AI.GitHubManager.App.csproj

jobs:
  windows-installer:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify version
        shell: pwsh
        run: |
          Select-String -Path $env:PROJECT -Pattern '<Version>1.6.3</Version>' -Quiet | Out-Null
          if (-not $?) { throw 'Project version is not 1.6.3.' }
          Select-String -Path installer/AI-GitHub-Manager.iss -Pattern '#define AppVersion "1.6.3"' -Quiet | Out-Null
          if (-not $?) { throw 'Installer version is not 1.6.3.' }

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore AI.GitHubManager.sln
          dotnet build AI.GitHubManager.sln -c Release --no-restore
          dotnet test AI.GitHubManager.sln -c Release --no-build --verbosity normal

      - name: Publish Windows x64 payload
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/publish/win-x64
          Copy-Item LICENSE artifacts/publish/win-x64/LICENSE.txt
          Copy-Item PRIVACY.md artifacts/publish/win-x64/PRIVACY.md
          Copy-Item SECURITY.md artifacts/publish/win-x64/SECURITY.md
          Copy-Item THIRD-PARTY-NOTICES.md artifacts/publish/win-x64/THIRD-PARTY-NOTICES.md
          Copy-Item RELEASE_NOTES_v1.6.3.md artifacts/publish/win-x64/RELEASE_NOTES.md

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer and checksum
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe was not found.' }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $iscc installer/AI-GitHub-Manager.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "artifacts/installer/AI_GitHub_Manager_Setup_${env:VERSION}_win-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AI_GitHub_Manager_Setup_${env:VERSION}_win-x64.exe" | Set-Content "$installer.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-v1.6.3
          path: |
            artifacts/installer/AI_GitHub_Manager_Setup_1.6.3_win-x64.exe
            artifacts/installer/AI_GitHub_Manager_Setup_1.6.3_win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to release v1.6.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.6.3 `
            artifacts/installer/AI_GitHub_Manager_Setup_1.6.3_win-x64.exe `
            artifacts/installer/AI_GitHub_Manager_Setup_1.6.3_win-x64.exe.sha256 `
            --clobber
